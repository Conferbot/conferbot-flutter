name: conferbot_flutter
description: Official Flutter SDK for Conferbot - Beautiful native chat widget for iOS and Android
version: 1.0.0
homepage: https://docs.conferbot.com/mobile/flutter
repository: https://github.com/conferbot/flutter-sdk
# No license field - proprietary

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.1.2
  socket_io_client: ^2.0.3+1

  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
