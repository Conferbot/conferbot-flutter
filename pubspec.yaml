name: conferbot_flutter
description: Official Flutter SDK for Conferbot - Beautiful native chat widget for iOS and Android
version: 1.0.0
homepage: https://docs.conferbot.com/mobile/flutter
repository: https://github.com/conferbot/flutter-sdk
# No license field - proprietary

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Networking
  http: ^1.1.2
  socket_io_client: ^2.0.3+1

  # Local storage (Hive for session persistence)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity & Offline Support
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.2

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1
  uuid: ^4.2.1

  # Audio recording and playback
  record: ^5.1.0
  audioplayers: ^5.2.1
  path_provider: ^2.1.1
  permission_handler: ^11.1.0

  # Media Players (NEW)
  video_player: ^2.8.2
  just_audio: ^0.9.36
  photo_view: ^0.14.0
  cached_network_image: ^3.3.1

  # Rich Text / Markdown Rendering
  flutter_markdown: ^0.6.18
  flutter_html: ^3.0.0-beta.2
  flutter_highlighter: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.7

  # HTTP Testing
  http: ^1.1.2

  # Hive code generation
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
